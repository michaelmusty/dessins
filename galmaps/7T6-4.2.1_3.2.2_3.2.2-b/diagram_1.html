<!DOCTYPE html>
<html>
<head>
    <title>Everett Diagram: (1,2,3,4) vs (5,6,7)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; }
        .edge { stroke: black; stroke-width: 1; fill: none; }
        .vertex { cursor: default; }
        .vertex-text {
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }
        .edge-label {
            font-size: 14px;
            text-anchor: middle;
            dominant-baseline: middle;
            font-weight: bold;
            pointer-events: none;
        }
        .edge-label-bg {
            fill: white;
            stroke: black;
            stroke-width: 1;
            rx: 3;
            ry: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Everett Diagram</h1>
        <p><strong>White permutation:</strong> (1,2,3,4)</p>
        <p><strong>Black permutation:</strong> (5,6,7)</p>
        <div id="graph"></div>
    </div>

    <script>
        const width = 800;
        const height = 600;
        const margin = 50;

        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("border", "1px solid #ccc");

        const graphData = {
            vertices: [
                { id: "w1", x: 0, y: 0, color: "white", textColor: "black" },                { id: "w2", x: 0, y: 0, color: "white", textColor: "black" },                { id: "w3", x: 0, y: 0, color: "white", textColor: "black" },                { id: "w4", x: 0, y: 0, color: "white", textColor: "black" },                { id: "b1", x: 1.4, y: 0, color: "black", textColor: "white" },                { id: "b2", x: 1.4, y: 0, color: "black", textColor: "white" },                { id: "b3", x: 1.4, y: 0, color: "black", textColor: "white" },                { id: "b4", x: 1.4, y: 0, color: "black", textColor: "white" },                { id: "b5", x: 1.4, y: 0, color: "black", textColor: "white" },
            ],
            straightEdges: [
,
            ],
            curvedEdges: [
                { id: 0, start: [0.22, 0.0], end: [1.6199999999999999, 0.0], control1: [0.7799999999999999, 0.0], control2: [2.1799999999999997, 0.0], label: "1", labelX: 0.9199999999999999, labelY: 0.0 },                { id: 1, start: [1.3471114790620885e-17, 0.22], end: [1.6199999999999999, 0.0], control1: [7.353526510000886e-17, 1.2009220152489188], control2: [2.6009220152489188, 0.0], label: "2", labelX: 0.8099999999999999, labelY: 0.11 },                { id: 2, start: [-0.22, 2.694222958124177e-17], end: [1.6199999999999999, 0.0], control1: [-1.692, 2.0721023841573215e-16], control2: [3.0919999999999996, 0.0], label: "3", labelX: 0.7, labelY: 1.3471114790620885e-17 },                { id: 3, start: [-4.041334437186265e-17, -0.22], end: [1.6199999999999999, 0.0], control1: [-2.206057953000266e-16, -1.2009220152489188], control2: [2.6009220152489188, 0.0], label: "4", labelX: 0.8099999999999999, labelY: -0.11 },                { id: 4, start: [0.22, 0.0], end: [1.6199999999999999, 0.0], control1: [0.7799999999999999, 0.0], control2: [2.1799999999999997, 0.0], label: "5", labelX: 0.9199999999999999, labelY: 0.0 },                { id: 5, start: [0.22, 0.0], end: [1.29, 0.1905255888325765], control1: [0.9445535023569881, 0.0], control2: [0.9277232488215061, 0.8180073282747164], label: "6", labelX: 0.755, labelY: 0.09526279441628825 },                { id: 6, start: [0.22, 0.0], end: [1.2899999999999998, -0.19052558883257645], control1: [0.944553502356988, 0.0], control2: [0.9277232488215055, -0.818007328274716], label: "7", labelX: 0.7549999999999999, labelY: -0.09526279441628822 },
            ]
        };

        // Calculate bounds and scales
        const allX = [...graphData.vertices.map(v => v.x), ...graphData.straightEdges.flatMap(e => [e.start[0], e.end[0]]), ...graphData.curvedEdges.flatMap(e => [e.start[0], e.end[0], e.control1[0], e.control2[0]])];
        const allY = [...graphData.vertices.map(v => v.y), ...graphData.straightEdges.flatMap(e => [e.start[1], e.end[1]]), ...graphData.curvedEdges.flatMap(e => [e.start[1], e.end[1], e.control1[1], e.control2[1]])];
        
        const minX = Math.min(...allX);
        const maxX = Math.max(...allX);
        const minY = Math.min(...allY);
        const maxY = Math.max(...allY);
        
        const padding = Math.max(maxX - minX, maxY - minY) * 0.1;
        const xScale = d3.scaleLinear()
            .domain([minX - padding, maxX + padding])
            .range([margin, width - margin]);

        const yScale = d3.scaleLinear()
            .domain([minY - padding, maxY + padding])
            .range([height - margin, margin]);

        // Draw edges
        svg.selectAll(".straight-edge")
            .data(graphData.straightEdges)
            .enter()
            .append("line")
            .attr("class", "edge")
            .attr("x1", d => xScale(d.start[0]))
            .attr("y1", d => yScale(d.start[1]))
            .attr("x2", d => xScale(d.end[0]))
            .attr("y2", d => yScale(d.end[1]));

        svg.selectAll(".curved-edge")
            .data(graphData.curvedEdges)
            .enter()
            .append("path")
            .attr("class", "curved-edge edge")
            .attr("d", d => `M ${xScale(d.start[0])} ${yScale(d.start[1])} C ${xScale(d.control1[0])} ${yScale(d.control1[1])} ${xScale(d.control2[0])} ${yScale(d.control2[1])} ${xScale(d.end[0])} ${yScale(d.end[1])}`);

        // Draw vertices
        svg.selectAll(".vertex")
            .data(graphData.vertices)
            .enter()
            .append("circle")
            .attr("class", "vertex")
            .attr("cx", d => xScale(d.x))
            .attr("cy", d => yScale(d.y))
            .attr("r", 15)
            .attr("fill", d => d.color)
            .attr("stroke", "black")
            .attr("stroke-width", 2);

        // Add labels
        svg.selectAll(".vertex-text")
            .data(graphData.vertices)
            .enter()
            .append("text")
            .attr("class", "vertex-text")
            .attr("x", d => xScale(d.x))
            .attr("y", d => yScale(d.y))
            .attr("fill", d => d.textColor)
            .text(d => d.id);

        // Add edge labels
        const edgeLabels = svg.selectAll(".edge-label")
            .data([...graphData.straightEdges, ...graphData.curvedEdges])
            .enter()
            .append("g")
            .attr("class", "edge-label-group");

        edgeLabels.append("rect")
            .attr("class", "edge-label-bg")
            .attr("x", d => xScale(d.labelX) - 8)
            .attr("y", d => yScale(d.labelY) - 8)
            .attr("width", 16)
            .attr("height", 16);

        edgeLabels.append("text")
            .attr("class", "edge-label")
            .attr("x", d => xScale(d.labelX))
            .attr("y", d => yScale(d.labelY))
            .text(d => d.label);
    </script>
</body>
</html>
